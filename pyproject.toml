[project]
name = "nethome-web-control"
version = "0.1.0"
description = "NetHome Plus AC control web application"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "keyring>=25,<26",
  "midea-beautiful-air==0.10.7",
  "pip-system-certs>=4,<5",
  "psycopg[binary]>=3.2,<4"
]

[tool.vercel]
entrypoint = "app.main:app"
